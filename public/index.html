<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support CRM | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f1f5f9; }

    .status-open {
      background-color: #dbeafe;
      color: #1d4ed8;
    }
    .status-inprogress {
      background-color: #fef9c3;
      color: #a16207;
    }
    .status-closed {
      background-color: #dcfce7;
      color: #15803d;
    }

    .filter-btn.active {
      background-color: #1e40af;
      color: #ffffff;
    }

    .ticket-row:hover {
      background-color: #f8fafc;
      cursor: pointer;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- ── NAVBAR ── -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 rounded-lg p-2">
            <i class="fas fa-headset text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold text-gray-900">Support CRM</h1>
            <p class="text-xs text-gray-500">Datastraw Technologies</p>
          </div>
        </div>
        
     <a href="/create.html" class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition duration-150">
    <i class="fas fa-plus mr-2"></i> New Ticket
</a>
  
        
      </div>
    </div>
  </nav>

  <!-- ── MAIN CONTENT ── -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Stats Row -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8" id="stats-row">
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-xs text-gray-500 uppercase tracking-wide">Total</p>
        <p class="text-2xl font-bold text-gray-800 mt-1" id="stat-total">—</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-xs text-blue-500 uppercase tracking-wide">Open</p>
        <p class="text-2xl font-bold text-blue-600 mt-1" id="stat-open">—</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-xs text-yellow-500 uppercase tracking-wide">In Progress</p>
        <p class="text-2xl font-bold text-yellow-600 mt-1" id="stat-inprogress">—</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-xs text-green-500 uppercase tracking-wide">Closed</p>
        <p class="text-2xl font-bold text-green-600 mt-1" id="stat-closed">—</p>
      </div>
    </div>

    <!-- Search + Filter Bar -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
      <div class="flex flex-col sm:flex-row gap-3">

        <!-- Search Input -->
        <div class="relative flex-1">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input
            id="search-input"
            type="text"
            placeholder="Search by name, email, ID, or description..."
            class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <!-- Filter Buttons -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-gray-400 font-medium">Filter:</span>
          <button class="filter-btn active px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 bg-gray-50 transition" data-status="All">All</button>
          <button class="filter-btn px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 bg-gray-50 transition" data-status="Open">Open</button>
          <button class="filter-btn px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 bg-gray-50 transition" data-status="In Progress">In Progress</button>
          <button class="filter-btn px-3 py-2 rounded-lg text-sm font-medium border border-gray-200 bg-gray-50 transition" data-status="Closed">Closed</button>
        </div>

      </div>
    </div>

    <!-- Ticket Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

      <!-- Table Header -->
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-gray-700">All Tickets</h2>
        <span id="result-count" class="text-xs text-gray-400"></span>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="py-16 text-center">
        <i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i>
        <p class="text-gray-400 text-sm mt-3">Loading tickets...</p>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="py-16 text-center hidden">
        <i class="fas fa-inbox text-gray-300 text-4xl"></i>
        <p class="text-gray-400 text-sm mt-3">No tickets found</p>
        <a href="/create.html" class="inline-block mt-4 text-blue-600 hover:underline text-sm">Create your first ticket →</a>
      </div>

      <!-- Table -->
      <div id="table-wrapper" class="hidden overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-100">
            <tr>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Ticket ID</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Customer</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">Subject</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">Created</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Action</th>
            </tr>
          </thead>
          <tbody id="ticket-tbody" class="divide-y divide-gray-50">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
